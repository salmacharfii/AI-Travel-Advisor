<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✈️ AI Travel Advisor</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
  margin: 0; height: 100vh;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    linear-gradient(rgba(20,40,90,.55), rgba(255,140,80,.35)),
    url("https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=70")
    center / cover fixed,
    linear-gradient(135deg, #4facfe, #f093fb);
  display: flex; justify-content: center; padding: 1rem;
}
.app {
  width: 100%; max-width: 720px;
  height: calc(100vh - 2rem);
  display: flex; flex-direction: column;
  background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
  border-radius: 24px; padding: 1.2rem 1.4rem;
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
  position: relative; z-index: 2;
}
  h1 { margin: 0; text-align: center; font-size: 1.9rem; }
  h1 .plane { display: inline-block; animation: fly 3s ease-in-out infinite; }
  .sub { text-align: center; margin: .2rem 0 1rem; color: #555; }
  @keyframes fly { 0%,100% { transform: translate(0,0) rotate(-5deg); } 50% { transform: translate(10px,-8px) rotate(5deg); } }

  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: .5rem; border-radius: 16px; background: rgba(255,255,255,.6); }
  .msg { margin: .6rem 0; padding: .6rem .9rem; border-radius: 16px; max-width: 88%; line-height: 1.45; animation: pop .25s ease; }
  .user { background: linear-gradient(135deg, #ff9a56, #ff6a88); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot  { background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 0; }
  .chip { border: 0; background: #fff3d6; border-radius: 999px; padding: .4rem .8rem; cursor: pointer; font-size: .9rem; }
  .chip:hover { background: #ffe29a; transform: scale(1.05); }

  form { display: flex; gap: .5rem; margin-top: .8rem; }
  input { flex: 1; padding: .8rem 1rem; border: 2px solid #ffb27a; border-radius: 999px; font-size: 1rem; outline: none; }
  input:focus { border-color: #ff6a88; }
  button.send, button.img {
    border: 0; border-radius: 999px; padding: .8rem 1.3rem; cursor: pointer; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #4facfe, #00c6a7);
  }
  button:disabled { opacity: .6; cursor: wait; }
  button.send:hover, button.img:hover { transform: scale(1.05); }
  .plan { max-width: 100%; }
.poster-zone {
  margin-top: 1rem; padding-top: 1rem;
  border-top: 3px dashed #ffb27a;
  text-align: center;
}
button.img {
  display: block; margin: 0 auto;
  padding: .9rem 1.8rem; font-size: 1.05rem;
  border: 0; border-radius: 999px; cursor: pointer; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #f093fb, #f5576c);
  box-shadow: 0 6px 16px rgba(245,87,108,.45);
}
img.poster {
  display: block; margin: 1rem auto 0;
  max-width: 100%; max-height: 60vh; width: auto; height: auto;
  object-fit: contain; border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

  .float { position: fixed; font-size: 2.2rem; opacity: .85; z-index: 1; animation: drift 9s ease-in-out infinite; pointer-events: none; }
  @keyframes drift { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-25px) rotate(8deg); } }

  .plan { background: linear-gradient(135deg, #fff8e1, #ffe9f3); border: 2px solid #ffb27a; }
.plan h1 {
  text-align: center; margin: .2rem 0 .6rem;
  background: linear-gradient(90deg, #ff6a88, #ff9a56, #4facfe);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.plan h2 { color: #fff; padding: .35rem .8rem; border-radius: 999px; font-size: 1.05rem; display: inline-block; }
.plan h2:nth-of-type(1) { background: #4facfe; }
.plan h2:nth-of-type(1)::before { content: "📝 "; }
.plan h2:nth-of-type(2) { background: #ff9a56; }
.plan h2:nth-of-type(2)::before { content: "🗓️ "; }
.plan h2:nth-of-type(3) { background: #00c6a7; }
.plan h2:nth-of-type(3)::before { content: "💡 "; }
.plan h2:nth-of-type(4) { background: #a86cf0; }
.plan h2:nth-of-type(4)::before { content: "💰 "; }
.plan ul { list-style: none; padding: 0; }
.plan li { background: #fff; border-left: 6px solid #ff6a88; border-radius: 10px; padding: .5rem .8rem; margin: .5rem 0; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.plan li:nth-child(4n+2) { border-color: #4facfe; }
.plan li:nth-child(4n+3) { border-color: #00c6a7; }
.plan li:nth-child(4n+4) { border-color: #ffb300; }
.plan strong { color: #d6336c; }
</style>
</head>
<body>
<span class="float" style="top:8%;left:4%">🌴</span>
<span class="float" style="top:20%;right:5%;animation-delay:1s">🗺️</span>
<span class="float" style="bottom:12%;left:6%;animation-delay:2s">🧳</span>
<span class="float" style="bottom:8%;right:6%;animation-delay:3s">🍕</span>
<span class="float" style="top:55%;left:2%;animation-delay:4s">📸</span>
<span class="float" style="top:45%;right:2%;animation-delay:5s">🏖️</span>

<div class="app">
  <h1><span class="plane">✈️</span> AI Travel Advisor 🌍</h1>
  <p class="sub">Tell me where your soul wants to go. Your wallet can stay home. 😎</p>

  <div id="chat"></div>

  <div class="chips">
    <button class="chip">🍝 5 days in Rome</button>
    <button class="chip">🏔️ Hiking in Switzerland</button>
    <button class="chip">🏝️ Beach week in Tunisia</button>
    <button class="chip">🍣 Foodie trip to Tokyo</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Pizza in Italy? Camels in Egypt? 🐪" autocomplete="off" required>
    <button class="send">Send 🚀</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let previousResponseId = null;

const waiting = ["Packing the suitcase 🧳...", "Asking the pigeons for directions 🐦...", "Booking a window seat ✈️...", "Tasting the local food 🍝...", "Consulting the map 🗺️..."];
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function add(cls, content, isHtml = false) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (isHtml) div.innerHTML = content; else div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

add("bot", "Hello, traveler! 👋🌴 Where are we going, for how long, and what do you love (food 🍔, museums 🏛️, beaches 🏖️, hiking 🥾)?", false);

document.querySelectorAll(".chip").forEach((c) =>
  c.addEventListener("click", () => { input.value = c.textContent; document.getElementById("form").requestSubmit(); })
);

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.querySelector(".chips").style.display = "none";
  add("user", text);
  const wait = add("bot", pick(waiting));

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, previous_response_id: previousResponseId }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const data = await res.json();
    previousResponseId = data.response_id;
    wait.innerHTML = marked.parse(data.answer);

    if (data.plan) {
    const box = add("bot", marked.parse(data.plan), true);
    box.classList.add("plan");

    const zone = document.createElement("div");
    zone.className = "poster-zone";
    const btn = document.createElement("button");
    btn.className = "img";
    btn.textContent = "🎨 Create my poster";
    btn.onclick = () => makeImage(data.plan, btn, zone);
    zone.appendChild(btn);
    box.appendChild(zone);
    }
  } catch (err) {
    wait.textContent = "Oops, the plane hit turbulence 🌪️ " + err.message;
  }
  chat.scrollTop = chat.scrollHeight;
});

async function makeImage(plan, btn, box) {
  btn.disabled = true;
  btn.textContent = "🖌️ Painting your poster (up to 60 s)...";
  try {
    const res = await fetch("/image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plan_text: plan }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const img = document.createElement("img");
    img.className = "poster";
    img.onload = () => img.scrollIntoView({ behavior: "smooth", block: "center" });
    img.src = URL.createObjectURL(await res.blob());
    box.appendChild(img);
  } catch (err) {
    alert("Poster failed 😭 " + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "🎨 Create my poster";
  }
}
</script>
</body>
</html>
